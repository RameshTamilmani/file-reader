name: Build Installable Android APK

on:
  push:
    branches: [ main, master, 'fix/**' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK (Directly Installable)
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPTX-Viewer-Debug-APK
          path: app/build/outputs/named-apk/PPTX-Viewer-debug.apk
